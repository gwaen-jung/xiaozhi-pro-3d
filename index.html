<!DOCTYPE html>
<html lang="vi">
<head>

<style>
  :root {
    --bg: #050608;
    --panel: rgba(12, 15, 22, 0.84);
    --border: rgba(255, 255, 255, 0.14);
    --apple-blue: #2997ff;
    --nvidia-green: #76b900;
    --reachy-amber: #ff9f0a;
    --cyan: #00f0ff;
    --text: #f5f5f7;
    --sub: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  #stage-wrap {
    position: relative;
    width: 100vw; height: 100vh;
    background: #05070b;
  }
  canvas#gl-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .letterbox {
    position: absolute; left: 0; right: 0;
    height: 0vh;
    background: #000;
    z-index: 15;
    transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .letterbox.top { top: 0; }
  .letterbox.bot { bottom: 0; }
  body.cinema-active .letterbox { height: 5.5vh; }

  #top-bar {
    position: absolute; top: 14px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 30;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .brand-pill {
    pointer-events: auto;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--nvidia-green);
    box-shadow: 0 0 12px var(--nvidia-green);
  }
  .brand-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #fff;
  }
  .brand-sub {
    font-size: 11px; color: var(--sub);
  }

  /* Mode Switcher Tabs at Top Center */
  .mode-tabs {
    pointer-events: auto;
    display: flex; gap: 6px;
    padding: 5px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .mode-tab {
    appearance: none; border: none;
    background: transparent;
    color: var(--sub);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-tab.active-commercial {
    background: linear-gradient(135deg, #2997ff, #0066cc);
    color: #fff;
    box-shadow: 0 4px 16px rgba(41,151,255,0.4);
  }
  .mode-tab.active-media {
    background: linear-gradient(135deg, #ff9f0a, #d97706);
    color: #000;
    box-shadow: 0 4px 16px rgba(255,159,10,0.45);
  }

  #control-dock {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex; flex-direction: column; gap: 8px;
    align-items: center;
    width: min(1220px, 96vw);
  }
  .timeline-bar {
    width: 100%; height: 7px;
    background: rgba(255,255,255,0.14);
    border-radius: 99px;
    overflow: hidden;
    cursor: pointer;
  }
  .timeline-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--apple-blue), var(--cyan), var(--nvidia-green));
    box-shadow: 0 0 12px var(--cyan);
  }
  .dock-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; align-items: center;
    padding: 9px 14px;
    background: var(--panel);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }
  button.btn {
    appearance: none; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #fff;
    padding: 7px 12px;
    border-radius: 9px;
    font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.18s ease;
  }
  button.btn:hover {
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-1px);
  }
  button.btn.active {
    background: rgba(0, 240, 255, 0.2);
    border-color: var(--cyan);
    color: #7ef9ff;
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
  }
  button.btn-primary {
    background: linear-gradient(135deg, #2997ff 0%, #0071e3 100%);
    border-color: #52adff;
    padding: 8px 16px;
    font-size: 12.5px;
    box-shadow: 0 5px 18px rgba(41,151,255,0.4);
  }
  button.btn-record {
    background: linear-gradient(135deg, #ff3b30 0%, #c81e14 100%);
    border-color: #ff6961;
    padding: 8px 16px;
    font-size: 12.5px;
    box-shadow: 0 5px 18px rgba(255,59,48,0.4);
  }
  button.btn-record.recording {
    animation: pulseRec 0.9s infinite alternate;
  }
  @keyframes pulseRec {
    from { box-shadow: 0 0 10px rgba(255,59,48,0.5); transform: scale(1); }
    to { box-shadow: 0 0 24px rgba(255,59,48,1); transform: scale(1.03); }
  }
  .divider {
    width: 1px; height: 20px; background: rgba(255,255,255,0.14); margin: 0 3px;
  }
  #rec-badge {
    position: absolute; top: 68px; right: 24px;
    z-index: 40;
    display: none; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 99px;
    background: rgba(220, 38, 38, 0.25);
    border: 1px solid #ef4444;
    color: #fca5a5;
    font-size: 12px; font-weight: 700;
  }
  #rec-badge.show { display: flex; }
  .rec-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #ef4444;
    animation: pulseRec 0.6s infinite alternate;
  }

  @media (max-width: 768px) {
    #top-bar { top: 8px; left: 8px; right: 8px; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .brand-pill { padding: 5px 10px; }
    .brand-title { font-size: 10px; }
    .brand-sub { display: none; }
    .mode-tab { padding: 5px 10px; font-size: 10.5px; }
    #control-dock { bottom: 8px; width: 98vw; gap: 5px; }
    .dock-row { padding: 6px 8px; gap: 4px; }
    button.btn { padding: 5px 8px; font-size: 10px; }
    button.btn-primary, button.btn-record { padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>

<!-- 100% Exact Mated Inventor Assembly Data -->
<script src="xiaozhi_meshes.js"></script>

<script>
// ============================================================================
// 1. DUAL-STYLE SOUND ENGINE (Apple/NVIDIA Epic Synth + Reachy Playful Pluck)
// ============================================================================
class DualSoundEngine {
  constructor() {
    this.ctx = null;
    this.dest = null;
    this.enabled = true;
    this.lastCue = -1;
  }
  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.78;
    this.master.connect(this.ctx.destination);
    this.dest = this.ctx.createMediaStreamDestination();
    this.master.connect(this.dest);
  }
  resume() {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playBassDrop(f1 = 100, f2 = 28, dur = 2.4, vol = 0.55) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur);
  }
  playChord(freqs, dur = 4.0, vol = 0.08) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    freqs.forEach((f, idx) => {
      const osc = this.ctx.createOscillator();
      const filt = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      osc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(f, t);
      osc.detune.setValueAtTime((idx - 1.5) * 7, t);
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(350, t);
      filt.frequency.exponentialRampToValueAtTime(1900, t + dur * 0.45);
      filt.frequency.exponentialRampToValueAtTime(420, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(filt); filt.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + dur);
    });
  }
  // Reachy Mini / Hugging Face style warm upbeat marimba/synth pluck arpeggio!
  playReachyArpeggio(notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5], step = 0.14, vol = 0.16) {
    if (!this.enabled || !this.ctx) return;
    notes.forEach((n, i) => {
      const t = this.ctx.currentTime + i * step;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n, t);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.38);
      osc.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.4);
    });
  }
  // Cute Robot Voice Bleep (R2D2 / Cozmo / Reachy Mini expressive chirp)
  playRobotChirp() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(680, t);
    osc.frequency.exponentialRampToValueAtTime(1420, t + 0.09);
    osc.frequency.exponentialRampToValueAtTime(960, t + 0.18);
    osc.frequency.exponentialRampToValueAtTime(1680, t + 0.28);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.34);
  }
  playLaserSweep(dur = 1.6) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const filt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(920, t + dur * 0.5);
    osc.frequency.exponentialRampToValueAtTime(180, t + dur);
    filt.type = 'bandpass'; filt.Q.value = 5.5;
    filt.frequency.setValueAtTime(450, t);
    filt.frequency.exponentialRampToValueAtTime(3000, t + dur * 0.5);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.13, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(filt); filt.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur);
  }
  triggerCues(mode, sec) {
    const cues = mode === 'commercial' ? [
      { t: 0.1, fn: () => { this.playBassDrop(95, 28, 2.6, 0.58); this.playChord([146.83, 220, 293.66, 369.99], 6.5, 0.08); } },
      { t: 2.5, fn: () => this.playRobotChirp() },
      { t: 7.0, fn: () => { this.playBassDrop(115, 34, 1.8, 0.45); this.playChord([164.81, 246.94, 329.63, 493.88], 7.5, 0.08); } },
      { t: 15.0, fn: () => { this.playBassDrop(135, 30, 2.4, 0.58); this.playLaserSweep(2.0); this.playChord([185.0, 277.18, 369.99, 554.37], 9.0, 0.09); } },
      { t: 26.0, fn: () => { this.playBassDrop(110, 32, 2.2, 0.52); this.playReachyArpeggio([440, 554.37, 659.25, 880], 0.11, 0.14); this.playChord([196.0, 293.66, 392.0, 587.33], 8.5, 0.09); } },
      { t: 35.0, fn: () => { this.playBassDrop(125, 35, 2.0, 0.48); this.playChord([220, 329.63, 440, 659.25], 5.0, 0.09); } },
      { t: 40.0, fn: () => { this.playBassDrop(105, 26, 3.4, 0.62); this.playChord([146.83, 220, 293.66, 440, 587.33, 880], 5.0, 0.11); this.playRobotChirp(); } }
    ] : [
      // 30s SIM-TO-REAL & REACHY MINI MEDIA VIDEO CUES
      { t: 0.1, fn: () => { this.playReachyArpeggio([523.25, 659.25, 783.99, 1046.5, 1318.5], 0.11, 0.18); this.playChord([261.63, 329.63, 392.0, 523.25], 5.8, 0.08); } },
      { t: 1.8, fn: () => this.playRobotChirp() },
      { t: 6.0, fn: () => { this.playBassDrop(120, 35, 1.6, 0.48); this.playLaserSweep(1.5); this.playChord([220, 277.18, 329.63, 440], 6.8, 0.09); } },
      { t: 13.0, fn: () => { this.playRobotChirp(); this.playReachyArpeggio([587.33, 739.99, 880, 1174.66], 0.12, 0.16); this.playChord([293.66, 369.99, 440, 587.33], 6.0, 0.09); } },
      { t: 19.0, fn: () => { this.playBassDrop(110, 32, 1.8, 0.5); this.playChord([196.0, 293.66, 392.0, 587.33], 6.0, 0.09); } },
      { t: 25.0, fn: () => { this.playBassDrop(100, 28, 2.5, 0.58); this.playReachyArpeggio([523.25, 659.25, 783.99, 1046.5, 1567.98], 0.10, 0.19); this.playRobotChirp(); } }
    ];
    for (let i = 0; i < cues.length; i++) {
      if (sec >= cues[i].t && this.lastCue < i && sec - cues[i].t < 0.5) {
        this.lastCue = i;
        cues[i].fn();
      }
    }
  }
}
const sound = new DualSoundEngine();

// ============================================================================
// 2. THREE.JS SCENE & STUDIO LIGHTING (CLEAN, BRIGHT, PHOTOREALISTIC CAD)
// ============================================================================
const outCanvas = document.getElementById('gl-canvas');
const outCtx = outCanvas.getContext('2d');

const webglCanvas = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({
  canvas: webglCanvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.90;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);

// Subtle Studio Environment Map (tuned so real metal parts shine while 3D-printed PETG stays matte & high-contrast)
function buildStudioEnvironment(ren) {
  const pmrem = new THREE.PMREMGenerator(ren);
  pmrem.compileCubemapShader();
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x05070c);

  const addSoftbox = (w, h, color, intensity, x, y, z, rx, ry, rz) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz);
    envScene.add(m);
  };
  addSoftbox(550, 550, 0xffffff, 1.05, 0, 500, 0, Math.PI / 2, 0, 0);
  addSoftbox(420, 300, 0xf1f5f9, 0.85, 420, 220, 380, -0.35, -0.75, 0);
  addSoftbox(420, 320, 0x38bdf8, 0.70, -450, 180, -280, 0.25, 0.85, 0);
  addSoftbox(480, 160, 0x93c5fd, 0.75, -380, 280, 320, -0.4, 2.2, 0);

  const envRT = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  return envRT.texture;
}
scene.environment = buildStudioEnvironment(renderer);
const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 2, 4000);
camera.position.set(340, 210, 310);

const controls = new THREE.OrbitControls(camera, outCanvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 12, 0);

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  outCanvas.width = w * dpr;
  outCanvas.height = h * dpr;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// Multi-Light Studio Setup (No harsh dark sides!)
const hemiLight = new THREE.HemisphereLight(0xe2e8f0, 0x111827, 0.56);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 0.98);
keyLight.position.set(260, 420, 240);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 60;
keyLight.shadow.camera.far = 1100;
const d = 240;
keyLight.shadow.camera.left = -d; keyLight.shadow.camera.right = d;
keyLight.shadow.camera.top = d;  keyLight.shadow.camera.bottom = -d;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLightLeft = new THREE.DirectionalLight(0x93c5fd, 0.52);
fillLightLeft.position.set(-280, 190, -220);
scene.add(fillLightLeft);

const rimLightFront = new THREE.DirectionalLight(0x38bdf8, 0.42);
rimLightFront.position.set(320, 80, -240);
scene.add(rimLightFront);

// Studio Floor + Precision Metric Grid
const floorGeo = new THREE.PlaneGeometry(3200, 3200);
const floorMat = new THREE.MeshPhysicalMaterial({
  color: 0x070a10,
  roughness: 0.24,
  metalness: 0.55,
  clearcoat: 0.35,

const eyeCanvas = document.createElement('canvas');

function updateLivingEyes(time, mode, actId) {
  const ctx = eyeCtx;
  ctx.fillStyle = '#05070c';
  ctx.fillRect(0, 0, 512, 384);

  // Subtle scanlines
  ctx.fillStyle = 'rgba(0, 240, 255, 0.035)';
  for (let y = 0; y < 384; y += 4) ctx.fillRect(0, y, 512, 1);

  const blinkCycle = time % 3.4;
  let openRatio = 1.0;
  if (blinkCycle > 3.18 && blinkCycle < 3.36) {
    openRatio = Math.abs((blinkCycle - 3.27) * 11);
  }
  if (mode === 'commercial' && actId === 0 && time < 2.2) {
    openRatio = Math.max(0.04, Math.min(1.0, (time - 1.0) * 1.1));
  }

  const lookX = Math.sin(time * 1.8) * 20;
  const lookY = Math.cos(time * 1.2) * 9;

  ctx.save();
  ctx.shadowColor = mode === 'media' ? '#38bdf8' : '#00f0ff';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#ffffff';

  const ew = 136;
  const eh = Math.max(8, 128 * openRatio);
  const rad = Math.min(20, eh / 2);

  const drawEye = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  };

  drawEye(88 + lookX, 198 - eh / 2 + lookY, ew, eh, rad);
  drawEye(288 + lookX, 198 - eh / 2 + lookY, ew, eh, rad);

  // Reachy Mini / Cozmo style expressive happy eye arcs
  if (openRatio > 0.55 && ((mode === 'media' && (actId === 0 || actId === 2 || actId === 4)) || (mode === 'commercial' && actId === 5))) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05070c';
    ctx.beginPath();
    ctx.arc(88 + ew / 2 + lookX, 198 + eh / 2 + 24 + lookY, 68, Math.PI * 1.15, Math.PI * 1.85);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(288 + ew / 2 + lookX, 198 + eh / 2 + 24 + lookY, 68, Math.PI * 1.15, Math.PI * 1.85);
    ctx.fill();
  }
  ctx.restore();

  // Voice AI waveform at bottom of TFT screen when speaking
  if (mode === 'media' && (actId === 0 || actId === 2)) {
    ctx.fillStyle = '#00f0ff';
    for (let b = 0; b < 24; b++) {
      const bh = 6 + Math.abs(Math.sin(time * 12 + b * 0.55)) * 22;
      ctx.fillRect(136 + b * 10, 355 - bh / 2, 6, bh);
    }
  }
  eyeTexture.needsUpdate = true;
}

function parseBase64STL(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const dv = new DataView(bytes.buffer);
  const nTris = dv.getUint32(80, true);
  const positions = new Float32Array(nTris * 9);
  const normals = new Float32Array(nTris * 9);
  let offset = 84;
  for (let i = 0; i < nTris; i++) {
    const nx = dv.getFloat32(offset, true);
    const ny = dv.getFloat32(offset + 4, true);
    const nz = dv.getFloat32(offset + 8, true);
    for (let v = 0; v < 3; v++) {
      const vo = offset + 12 + v * 12;
      const idx = i * 9 + v * 3;
      positions[idx]     = dv.getFloat32(vo, true);
      positions[idx + 1] = dv.getFloat32(vo + 4, true);
      positions[idx + 2] = dv.getFloat32(vo + 8, true);
      normals[idx]       = nx;
      normals[idx + 1]   = ny;
      normals[idx + 2]   = nz;
    }
    offset += 50;
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  return geom;
}

function unpackOgsGeometries(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const dv = new DataView(bytes.buffer);
  let ptr = 0;
  const numGeoms = dv.getUint32(ptr, true); ptr += 4;
  const geoms = [];

  for (let g = 0; g < numGeoms; g++) {
    const nVerts = dv.getUint32(ptr, true); ptr += 4;
    const nIndices = dv.getUint32(ptr, true); ptr += 4;
    const positions = new Float32Array(nVerts * 3);
    const normals = new Float32Array(nVerts * 3);

    for (let v = 0; v < nVerts; v++) {
      positions[v * 3]     = dv.getFloat32(ptr, true);
      positions[v * 3 + 1] = dv.getFloat32(ptr + 4, true);
      positions[v * 3 + 2] = dv.getFloat32(ptr + 8, true);
      normals[v * 3]       = dv.getFloat32(ptr + 12, true);
      normals[v * 3 + 1]   = dv.getFloat32(ptr + 16, true);
      normals[v * 3 + 2]   = dv.getFloat32(ptr + 20, true);
      ptr += 24;
    }
    const indices = new Uint16Array(nIndices);
    for (let k = 0; k < nIndices; k++) {
      indices[k] = dv.getUint16(ptr + k * 2, true);
    }
    ptr += (nIndices * 2 + 3) & ~3;

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geom.setIndex(new THREE.BufferAttribute(indices, 1));
    geoms.push(geom);
  }
  return geoms;
}

function buildExactMatedAssembly() {
  const data = window.XIAOZHI_IAM_DATA;
  if (!data) return;

  // 1. Set exact wheel group pivots so rotation.x spins each Mecanum wheel around its true axle!
  Object.entries(data.wheelPivots).forEach(([wName, piv]) => {
    if (groups[wName]) groups[wName].position.set(piv[0], piv[1], piv[2]);
  });

  // 2. Unpack all 212 unique CAD geometries
  const geoms = unpackOgsGeometries(data.ogsGeomsB64);

  // Physically Accurate Material System:
  // - 3D-Printed Parts (Shells, Base Chassis, Wheel Hubs, Pads, Logos): Matte 3D-Printed PETG (clearcoat = 0, metalness = 0.04, roughness = 0.60..0.68)
  // - True Metal Parts ONLY: 12mm Metal Power Button (cube_pwr_btn), 4x Johnson Geared Motors (base_motors), Brass Hex Couplings & SMA Nut
  const matCache = new Map();
  function getMaterial(rgb, grp, s) {
    let [r, g, b] = rgb;
    let roughness = 0.60, metalness = 0.04, clearcoat = 0.0, clearcoatRoughness = 0.4, envMapIntensity = 0.25, polyOffset = false;
    let emissiveR = 0, emissiveG = 0, emissiveB = 0, emissiveInt = 0;

    if (s === 755) {
      // 12mm Power Button Glowing Cyan Ring LED & Power Symbol
      r = 0.0; g = 0.95; b = 1.0; roughness = 0.2; metalness = 0.1;
      emissiveR = 0.0; emissiveG = 0.85; emissiveB = 1.0; emissiveInt = 1.35;
      polyOffset = true;
    } else if (grp === 'cube_pwr_btn') {
      if (s === 754 || s === 761) {
        // 12mm Metal Power Button Body & Outer Chamfered Bezel: Brushed Stainless Steel / Titanium
        r = 0.44; g = 0.47; b = 0.52; roughness = 0.24; metalness = 0.90; clearcoat = 0.15; envMapIntensity = 1.3;
      } else if (s === 760) {
        // Black Rubber O-Ring Gasket
        r = 0.04; g = 0.045; b = 0.05; roughness = 0.72; metalness = 0.04;
      } else {
        // Brass/Gold Switch Terminal Pins
        r = 0.85; g = 0.66; b = 0.22; roughness = 0.22; metalness = 0.92; envMapIntensity = 1.25;
      }
    } else if (grp === 'base_motors') {
      // 4x Johnson Geared Motors + Brackets + Shafts under Mecanum Base: Real Brushed Steel & Alloy Metal!
      if (r < 0.6) {
        // DC Motor Brushed Steel Cylinder Housing
        r = 0.46; g = 0.49; b = 0.54; roughness = 0.26; metalness = 0.88; envMapIntensity = 1.25;
      } else {
        // Gearbox & Mounting Bracket: Machined Aluminum / Bright Steel
        r = 0.68; g = 0.71; b = 0.76; roughness = 0.28; metalness = 0.85; envMapIntensity = 1.20;
      }
    } else if (s === 763 || s === 764) {
      // Tail Antenna SMA Metal Hex Nut & Washer: Polished Chrome Steel
      r = 0.58; g = 0.61; b = 0.66; roughness = 0.22; metalness = 0.92; envMapIntensity = 1.3;
    } else if (r > 0.7 && g > 0.5 && b < 0.6) {
      // Brass Hex Wheel Couplings & Antenna Gold Collar Rings & Gold PCB Pads
      roughness = 0.22; metalness = 0.90; envMapIntensity = 1.25;
    } else if (s === 2 || s === 13 || (g > 0.28 && r < 0.18)) {
      // Custom Altium PCB (pcb_xiaozhi NEW s=2 & Base PCB s=13): Deep Matte/Satin Dark Emerald FR4 Solder Mask (Zero glare!)
      r = 0.025; g = 0.27; b = 0.105; roughness = 0.54; metalness = 0.06; clearcoat = 0.0; envMapIntensity = 0.25;
    } else if (r < 0.08 && g < 0.08 && b < 0.10) {
      if (grp.startsWith('wheel_')) {
        // 36 Angled Mecanum Rollers: Deep Matte Black Vulcanized Rubber (dark & high-contrast!)
        r = 0.038; g = 0.042; b = 0.050; roughness = 0.70; metalness = 0.03; clearcoat = 0.0; envMapIntensity = 0.16;
      } else {
        // Jet Matte Black PETG: 5 Top Pads (s=499), ReShape Gear-Circuit Logos (s=753, s=9), RESHAPE LAB Badge Pads (s=93,94)
        r = 0.022; g = 0.025; b = 0.032; roughness = 0.64; metalness = 0.04; clearcoat = 0.0; envMapIntensity = 0.15;
        polyOffset = true;
      }
    } else if (r < 0.26 && g < 0.26 && b < 0.26) {
      // Matte Black Polymer: Tail Dipole Whip Antenna Body (s=762,766,767,770), Battery Packs (s=8, s=573), INMP441 Mics
      r = 0.045; g = 0.050; b = 0.060; roughness = 0.64; metalness = 0.05; clearcoat = 0.0; envMapIntensity = 0.18;
    } else if (Math.abs(r - 0.315) < 0.04 && Math.abs(g - 0.315) < 0.04) {
      // Dark 3D-Printed PETG Parts: Mecanum Base Chassis (s=4), Mecanum Bottom Covers (s=5,12), Mecanum Wheel Hubs, Front Bezel (s=7), ESP32-S3 CAM body (s=511)
      if (grp.startsWith('wheel_')) {
        // Wheel Hub Plates: Deep Dark Charcoal Matte PETG (distinct against the jet-black rubber rollers)
        r = 0.095; g = 0.105; b = 0.122; roughness = 0.62; metalness = 0.05; clearcoat = 0.0; envMapIntensity = 0.20;
      } else {
        // Mecanum Chassis & Front Bezel: Deep Anthracite / Charcoal Matte PETG (No more washed-out grey!)
        r = 0.075; g = 0.082; b = 0.096; roughness = 0.64; metalness = 0.04; clearcoat = 0.0; envMapIntensity = 0.18;
      }
    } else if (r > 0.7 && g > 0.7 && b > 0.7) {
      if (s === 514 || s === 515) {
        // White 3D Letters "RESHAPE LAB" on the black side badge pad: Pure Crisp Matte White PETG
        r = 0.96; g = 0.97; b = 0.99; roughness = 0.55; metalness = 0.02; clearcoat = 0.0; envMapIntensity = 0.20;
        polyOffset = true;
      } else if (grp === 'cube_pcb' || grp === 'base_pcb') {
        // Metal USB-C Ports, IC Pins & Connectors on PCBs
        r = 0.62; g = 0.65; b = 0.70; roughness = 0.28; metalness = 0.82; envMapIntensity = 1.0;
      } else {
        // White 3D-Printed PETG Shells (nắp thân trên s=1, nắp thân dưới s=0, đế lót s=3, gá cam s=512,513, nắp khóa đáy s=6):
        // Matte PETG White (softened to 0.87 so bevels, holes & 12mm metal button have crisp shading and zero glare!)
        r = 0.86; g = 0.88; b = 0.91; roughness = 0.62; metalness = 0.03; clearcoat = 0.0; envMapIntensity = 0.22;
      }
    }

    const key = `${r.toFixed(3)}_${g.toFixed(3)}_${b.toFixed(3)}_${roughness}_${metalness}_${polyOffset}_${emissiveInt}`;
    if (!matCache.has(key)) {
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(r, g, b),
        roughness,
        metalness,
        clearcoat,
        clearcoatRoughness,
        envMapIntensity,
        emissive: new THREE.Color(emissiveR, emissiveG, emissiveB),
        emissiveIntensity: emissiveInt,
        side: THREE.DoubleSide,
        polygonOffset: polyOffset,
        polygonOffsetFactor: polyOffset ? -2 : 0,
        polygonOffsetUnits: polyOffset ? -2 : 0
      });
      matCache.set(key, mat);
      allShadedMaterials.push(mat);
    }
    return matCache.get(key);
  }

  // Subtle mechanical contour crease lines (opacity 0.12) so white PETG shells, flashing holes, and 12mm metal button have crisp edge definition!
  const edgeMat = new THREE.LineBasicMaterial({
    color: 0x1e2530,
    transparent: true,
    opacity: 0.12
  });

  // 3. Instantiate all mated CAD occurrences from v3 OGS_Scene
  for (const ins of data.instances) {
    if (ins.grp === 'cube_eyes' || ins.s === 92 || ins.s === 500) continue; // Skip static 3D white eye blocks
    const baseGeom = geoms[ins.gIdx];
    if (!baseGeom) continue;
    const targetGrp = groups[ins.grp] || groups.cube_pcb;

    const mat = getMaterial(ins.rgb, ins.grp, ins.s);
    const mesh = new THREE.Mesh(baseGeom, mat);
    mesh.matrixAutoUpdate = false;

    const m = ins.m.slice();
    if (ins.grp.startsWith('wheel_') && data.wheelPivots[ins.grp]) {
      const piv = data.wheelPivots[ins.grp];
      m[12] -= piv[0];
      m[13] -= piv[1];
      m[14] -= piv[2];
    }

    mesh.matrix.fromArray(m);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    targetGrp.add(mesh);

    if (
      ins.grp === 'base_chassis' || ins.grp === 'base_bottom' || ins.grp === 'dock_plate' ||
      ins.grp === 'cube_bot' || ins.grp === 'cube_top' || ins.grp === 'cube_cam' ||
      ins.grp === 'cube_pwr_btn' || ins.grp === 'cube_antenna'
    ) {
      const edges = new THREE.EdgesGeometry(baseGeom, 34);
      const line = new THREE.LineSegments(edges, edgeMat);
      line.matrixAutoUpdate = false;
      line.matrix.copy(mesh.matrix);
      targetGrp.add(line);
      cadEdgeLines.push(line);
    }
  }

  // 4. Add 60FPS Living AI Eyes Display Screen inside the front bezel window (`X = +55.25, Y = +59.5, Z = 0`)
  const lcdScreen = new THREE.Mesh(
    new THREE.PlaneGeometry(58.4, 44.2),
    new THREE.MeshBasicMaterial({
      map: eyeTexture,
      side: THREE.DoubleSide,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    })
  );
  lcdScreen.position.set(55.25, 59.5, 0.0);
  lcdScreen.rotation.y = Math.PI / 2;
  groups.cube_display.add(lcdScreen);
}

      sound.lastCue = -1;

    container.appendChild(b);
  });
}

function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function quinticSmooth(x) {
  const u = Math.max(0, Math.min(1, x));
  return u * u * u * (u * (u * 6 - 15) + 10);
}

function evaluateSeamlessSpline(mode, t) {
  const kf = SEAMLESS_SPLINES[mode] || SEAMLESS_SPLINES.commercial;
  if (t <= kf[0].t) return kf[0];
  if (t >= kf[kf.length - 1].t) return kf[kf.length - 1];
  for (let i = 0; i < kf.length - 1; i++) {
    const a = kf[i], b = kf[i + 1];
    if (t >= a.t && t <= b.t) {
      const u = quinticSmooth((t - a.t) / (b.t - a.t));
      return {
        r:   THREE.MathUtils.lerp(a.r,   b.r,   u),
        az:  THREE.MathUtils.lerp(a.az,  b.az,  u),
        el:  THREE.MathUtils.lerp(a.el,  b.el,  u),
        tx:  THREE.MathUtils.lerp(a.tx,  b.tx,  u),
        ty:  THREE.MathUtils.lerp(a.ty,  b.ty,  u),
        tz:  THREE.MathUtils.lerp(a.tz,  b.tz,  u),
        exp: THREE.MathUtils.lerp(a.exp, b.exp, u)
      };
    }
  }
  return kf[kf.length - 1];
}

function drawReShapeIntroOverlay(ctx, w, h, tSec, introDur) {
  if (tSec >= introDur) return;
  const p = tSec / introDur; // 0.0 -> 1.0

  // Phase 1 (0.00..0.32): Logo flies down from top to center
  const pFly = Math.min(1, p / 0.32);
  const flyEase = 1 - Math.pow(1 - pFly, 3);

  // Phase 2 (0.24..0.64): "RESHAPE LAB" text reveals below logo
  const pText = Math.max(0, Math.min(1, (p - 0.24) / 0.28));
  const textEase = 1 - Math.pow(1 - pText, 3);

  // Phase 3 (0.64..1.00): Center logo zooms out dramatically (1x -> 16x) and dissolves into the 3D robot reveal!
  const pZoom = Math.max(0, Math.min(1, (p - 0.64) / 0.36));
  const zoomCurve = Math.pow(pZoom, 2.6);
  const zoomScale = 1.0 + zoomCurve * 15.5;
  const contentAlpha = Math.min(1, p / 0.10) * Math.pow(1 - pZoom, 1.45);
  const bgAlpha = Math.pow(1 - Math.max(0, (p - 0.56) / 0.44), 1.6);

  ctx.save();

  // 1. Deep Cinema Backdrop that smoothly dissolves as the logo zooms through the camera
  if (bgAlpha > 0.005) {
    ctx.fillStyle = `rgba(4, 6, 11, ${bgAlpha.toFixed(3)})`;
    ctx.fillRect(0, 0, w, h);

    // Subtle volumetric cyan/blue studio spotlight behind the emblem
    const rad = Math.max(w, h) * 0.42;
    const rg = ctx.createRadialGradient(w * 0.5, h * 0.45, 10, w * 0.5, h * 0.45, rad);
    rg.addColorStop(0, `rgba(0, 240, 255, ${(0.18 * bgAlpha).toFixed(3)})`);
    rg.addColorStop(0.45, `rgba(41, 151, 255, ${(0.07 * bgAlpha).toFixed(3)})`);
    rg.addColorStop(1, 'rgba(4, 6, 11, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, w, h);
  }

  // 2. Transform to screen center with fly-down offset & dramatic zoom-through expansion
  const baseScale = Math.min(w, h) / 1080;
  const flyYOffset = (1 - flyEase) * (-h * 0.34);
  const cx = w * 0.5;
  const cy = h * 0.43 + flyYOffset;

  ctx.translate(cx, cy);
  ctx.scale(zoomScale * baseScale, zoomScale * baseScale * (0.78 + 0.22 * flyEase));
  ctx.globalAlpha = Math.max(0, Math.min(1, contentAlpha));

  // Glowing outer ring around the ReShape Spider-Circuit Emblem
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
  ctx.lineWidth = 2.0;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 28;
  ctx.beginPath();
  ctx.arc(0, 0, 124, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Draw Cinq's 100% Authentic ReShape Spider-Circuit CAD Logo (centered at 120,120 in 240x240 coords)
  ctx.save();
  ctx.translate(-120, -120);
  const lg = ctx.createLinearGradient(20, 20, 220, 220);
  lg.addColorStop(0, '#ffffff');
  lg.addColorStop(0.5, '#e2e8f0');
  lg.addColorStop(1, '#38bdf8');
  ctx.fillStyle = lg;
  ctx.strokeStyle = lg;
  ctx.lineWidth = 0.85;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 24;
  ctx.fill(reshapeSpiderPath2D);
  ctx.stroke(reshapeSpiderPath2D);
  ctx.restore();

  // 3. Reveal "RESHAPE LAB" & Subtitle beneath the emblem during Phase 2
  if (pText > 0.01) {
    const textY = 175 + (1 - textEase) * 24;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, contentAlpha * textEase));
    ctx.textAlign = 'center';

    // Glowing cyan divider line
    const lineW = 180 * textEase;
    ctx.strokeStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-lineW, textY - 46);
    ctx.lineTo(lineW, textY - 46);
    ctx.stroke();

    // Main Title: RESHAPE LAB
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0, 240, 255, 0.65)';
    ctx.shadowBlur = 22;
    ctx.font = '900 54px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${(14 - 4 * textEase).toFixed(1)}px`;
    ctx.fillText('RESHAPE LAB', 0, textY);

    // Subtitle: FPT POLYTECHNIC ĐÀ NẴNG
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#38bdf8';
    ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
    ctx.fillText('FPT POLYTECHNIC ĐÀ NẴNG • ROBOTICS & AI ENGINEERING', 0, textY + 34);
    ctx.restore();
  }

  ctx.restore();
}

function project3DTo2D(vec3, w, h) {
  const v = vec3.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * w,
    y: (-(v.y * 0.5) + 0.5) * h,
    visible: v.z < 1.0
  };
}

function draw3DCallout(ctx, worldPos, offX, offY, tag, title, detail, color, w, h, alpha = 1.0) {
  const pt = project3DTo2D(worldPos, w, h);
  if (!pt.visible || alpha <= 0.01) return;
  const bx = pt.x + offX;
  const by = pt.y + offY;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 4.0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pt.x, pt.y);
  ctx.lineTo(pt.x + offX * 0.45, by);
  ctx.lineTo(bx, by);
  ctx.stroke();

  const cw = 305, ch = 66;
  const cardX = offX >= 0 ? bx : bx - cw;
  const cardY = by - ch / 2;
  ctx.fillStyle = 'rgba(8, 12, 20, 0.84)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cw, ch, 10);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText(tag, cardX + 14, cardY + 19);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(title, cardX + 14, cardY + 38);
  ctx.fillStyle = '#9ca3af';
  ctx.font = '12px sans-serif';
  ctx.fillText(detail, cardX + 14, cardY + 55);
  ctx.restore();
}

function drawSimToRealOverlay(ctx, w, h, splitX, tSec) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, splitX, h);
  ctx.clip();

  ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
  ctx.fillRect(0, 0, splitX, h);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x < splitX; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(splitX, y); ctx.stroke();
  }

  const pivs = window.XIAOZHI_IAM_DATA ? window.XIAOZHI_IAM_DATA.wheelPivots : {};
  Object.entries(pivs).forEach(([wName, p], idx) => {
    const pt = project3DTo2D(new THREE.Vector3(p[0], p[1], p[2]), w, h);
    if (!pt.visible) return;
    ctx.strokeStyle = '#76b900';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 18, 0, Math.PI * 2);
    ctx.stroke();
    const vx = pt.x + Math.cos(tSec * 3 + idx) * 45;
    const vy = pt.y - 35;
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y);
    ctx.lineTo(vx, vy);
    ctx.stroke();
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`${wName}: ω=${(12.4 + Math.sin(tSec*4+idx)*2.1).toFixed(1)} rad/s`, pt.x - 45, pt.y + 34);
  });

  const bx = w * 0.04, by = h * 0.16;
  ctx.fillStyle = 'rgba(8, 16, 28, 0.86)';
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bx, by, 340, 148, 12);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#00f0ff';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('◀ DIGITAL TWIN SIMULATION (CAD/ISAAC)', bx + 16, by + 26);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '12px monospace';
  ctx.fillText('• CAD Assembly : xiaozhi_robot.iam (659 parts)', bx + 16, by + 50);
  ctx.fillText(`• Mecanum Kinematics: Vx=${(Math.sin(tSec*2)*0.45).toFixed(2)} Vy=${(Math.cos(tSec*2)*0.32).toFixed(2)} m/s`, bx + 16, by + 72);
  ctx.fillText('• ESP-NOW Link : 2.4GHz Dipole Antenna <0.8ms', bx + 16, by + 94);
  ctx.fillText(`• Dual INMP441 : Azimuth ${(Math.sin(tSec*1.5)*35).toFixed(1)}° VAD=ACTIVE`, bx + 16, by + 116);
  ctx.fillStyle = '#76b900';
  ctx.fillText('• Sim-to-Real Sync Error: < 0.02 mm', bx + 16, by + 136);
  ctx.restore();

  if (realVideoActive && realVideoEl.readyState >= 2) {
    ctx.save();
    const pw = Math.min(460, w * 0.28);
    const ph = pw * 0.62;
    const px = w * 0.95 - pw;
    const py = h * 0.16;
    ctx.strokeStyle = '#ff9f0a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 16);
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 16);
    ctx.clip();
    ctx.drawImage(realVideoEl, px, py, pw, ph);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(px + 12, py + 12, 235, 28);
    ctx.fillStyle = '#ff9f0a';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('● REAL HARDWARE FEED (LIVE)', px + 22, py + 30);
    ctx.restore();
  } else {
    ctx.save();
    const rx = Math.max(splitX + 24, w * 0.95 - 320);
    const ry = h * 0.16;
    if (rx + 300 < w) {
      ctx.fillStyle = 'rgba(14, 18, 26, 0.86)';
      ctx.strokeStyle = '#ff9f0a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(rx, ry, 305, 92, 12);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff9f0a';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('PHYSICAL REALITY / PBR TWIN ▶', rx + 16, ry + 26);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '12px monospace';
      ctx.fillText('• Vỏ in 3D BambuLab PLA+ & Antenna Đuôi', rx + 16, ry + 50);
      ctx.fillText('• Bo mạch Altium Custom pcb_xiaozhi NEW', rx + 16, ry + 72);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 20;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(splitX, 0);
  ctx.lineTo(splitX, h);
  ctx.stroke();

  ctx.fillStyle = '#050811';
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(splitX - 78, h * 0.5 - 18, 156, 36, 18);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('◀ SIM  ⇄  REAL ▶', splitX, h * 0.5 + 4);
  ctx.restore();
}

function renderCompositeFrame(activeAct, localProgress, tSec) {
  const w = outCanvas.width;
  const h = outCanvas.height;
  outCtx.clearRect(0, 0, w, h);
  outCtx.drawImage(webglCanvas, 0, 0, w, h);

  // Sim-to-Real Split Screen Wipe
  const showSimReal = manualSimReal || (activeAct && activeAct.simSplit > 0.5);
  if (showSimReal) {
    const splitRatio = isPlaying
      ? 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(localProgress * Math.PI * 2))
      : 0.50 + 0.18 * Math.sin(tSec * 1.1);
    drawSimToRealOverlay(outCtx, w, h, w * splitRatio, tSec);
  }

  // Exploded View 3D Engineering Callouts (6 clean callouts covering CAM, Antenna, Shell, PCB, and Full Mecanum Base!)
  if (currentExplode > 0.28 && (!activeAct || !(currentMode === 'commercial' && activeAct.id === 4))) {
    const callAlpha = Math.min(1, (currentExplode - 0.28) / 0.45);
    draw3DCallout(outCtx, new THREE.Vector3(8, 228, 0), -255, -35,
      "VISION MODULE • TOP TURRET", "ESP32-S3-MOUDULECAM_MINI", "Tách rời độc lập • Thị giác máy tính & Nhận diện", "#a855f7", w, h, callAlpha);
    draw3DCallout(outCtx, new THREE.Vector3(-125, 195, 0), -240, 28,
      "RF & POWER • REAR PANEL", "Antenna Dipole 2.4GHz + Nút Nguồn Kim Loại 12mm", "Khớp nối SMA • Vòng LED Cyan • Vỏ Nhựa In 3D PETG", "#2997ff", w, h, callAlpha);
    draw3DCallout(outCtx, new THREE.Vector3(105, 86, 0), 180, -45,
      "EMOTION DISPLAY • FRONT", "Màn hình 2.8\" ILI9341 SPI + Ốp Mặt PETG", "Đôi mắt AI 60FPS biểu cảm • Tem chữ trắng RESHAPE LAB", "#00f0ff", w, h, callAlpha);
    draw3DCallout(outCtx, new THREE.Vector3(0, 56, 0), 210, 18,
      "MAINBOARD • CUSTOM ALTIUM PCB", "pcb_xiaozhi NEW (WeAct ESP32-S3 N16R8)", "Dual Mic INMP441 I2S • PCM5100A DAC • Lỗ nạp code mới", "#76b900", w, h, callAlpha);
    draw3DCallout(outCtx, new THREE.Vector3(0, -108, 0), -245, 42,
      "MECANUM BASE • FULL EXPLODED", "Khung Đế PETG + Mạch Đế + 4 Động Cơ Kim Loại", "4 Bánh Mecanum (36 Con lăn) • Hộp Pin 4x18650 • Nắp Đáy", "#ff9f0a", w, h, callAlpha);
  }

  // Reachy Mini Companion Speech Bubble in Media Mode Scene 1 & Scene 3
  const introDur = currentMode === 'commercial' ? 4.3 : 2.9;
  if (currentMode === 'media' && activeAct && (activeAct.id === 0 || activeAct.id === 2) && (!isPlaying || tSec > introDur)) {
    const headPt = project3DTo2D(new THREE.Vector3(55, 95, 0), w, h);
    if (headPt.visible) {
      outCtx.save();
      const msg = activeAct.id === 0
        ? "💬 \"Xin chào BGK! Tớ là Xiaozhi Pro từ ReShape Lab!\""
        : "🎙️ Beamforming VAD: Đã khóa hướng giọng nói (Azimuth +18°)";
      outCtx.font = `bold ${Math.round(w * 0.011)}px sans-serif`;
      const tw = outCtx.measureText(msg).width + 36;
      const bx = Math.min(w - tw - 30, Math.max(30, headPt.x + 30));
      const by = Math.max(80, headPt.y - 75);
      outCtx.fillStyle = 'rgba(15, 23, 42, 0.90)';
      outCtx.strokeStyle = '#ff9f0a';
      outCtx.lineWidth = 2;
      outCtx.beginPath();
      outCtx.roundRect(bx, by, tw, 46, 23);
      outCtx.fill(); outCtx.stroke();
      outCtx.fillStyle = '#fff';
      outCtx.fillText(msg, bx + 18, by + 28);
      outCtx.restore();
    }
  }

  // Bento Grid in Commercial Act V
  if (currentMode === 'commercial' && activeAct && activeAct.id === 4) {
    const fade = Math.min(1, localProgress * 4) * Math.min(1, (1 - localProgress) * 5);
    drawBentoOverlay(outCtx, w, h, fade);
  }

  // Clean Lower-Third Apple / NVIDIA / Reachy Title Superimposition (shown after Intro Logo finishes zooming!)
  if (activeAct && (isPlaying || document.body.classList.contains('cinema-active')) && tSec > introDur * 0.82) {
    const introFadeIn = Math.min(1, Math.max(0, (tSec - introDur * 0.82) / 0.7));
    const fade = introFadeIn * Math.min(1, localProgress * 4.5) * Math.min(1, (1 - localProgress) * 4.5);
    outCtx.save();
    outCtx.globalAlpha = fade;

    const leftX = w * 0.05;
    const baseY = h * 0.83;

    outCtx.fillStyle = currentMode === 'media' ? '#ff9f0a' : '#00f0ff';
    outCtx.font = `700 ${Math.round(w * 0.0085)}px -apple-system, BlinkMacSystemFont, sans-serif`;
    outCtx.fillText(activeAct.kicker, leftX, baseY - h * 0.064);

    outCtx.fillStyle = '#ffffff';
    outCtx.shadowColor = 'rgba(0,0,0,0.92)';
    outCtx.shadowBlur = 20;
    outCtx.font = `800 ${Math.round(w * 0.025)}px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif`;
    outCtx.fillText(activeAct.title, leftX, baseY - h * 0.021);

    outCtx.fillStyle = '#e5e7eb';
    outCtx.font = `500 ${Math.round(w * 0.0112)}px -apple-system, BlinkMacSystemFont, sans-serif`;
    outCtx.fillText(activeAct.subtitle, leftX, baseY + h * 0.014);

    outCtx.textAlign = 'right';
    outCtx.fillStyle = 'rgba(255,255,255,0.9)';
    outCtx.font = `700 ${Math.round(w * 0.008)}px sans-serif`;
    outCtx.fillText("RESHAPE LAB • FPT POLYTECHNIC ĐÀ NẴNG", w * 0.95, h * 0.09);
    outCtx.fillStyle = currentMode === 'media' ? '#ff9f0a' : '#76b900';
    outCtx.font = `700 ${Math.round(w * 0.007)}px monospace`;
    outCtx.fillText(activeAct.badge, w * 0.95, h * 0.11);

    outCtx.restore();
  }

  // ReShape Lab Opening Sequence Overlay (0.0s .. introDur):
  // 1) ReShape Spider-Circuit Logo flies down to screen center
  // 2) "RESHAPE LAB" text reveals
  // 3) Center logo zooms out dramatically (1x -> 16x) and fades out into the 3D scene!
  if (isPlaying && tSec < introDur) {
    drawReShapeIntroOverlay(outCtx, w, h, tSec, introDur);
  }
}

// ============================================================================
// 8. MAIN ANIMATION LOOP (100% SEAMLESS CAMERA SPLINE + TRUE WHEEL AXLE SPIN)
// ============================================================================
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  const tl = TIMELINES[currentMode];
  let activeAct = null;
  let localProgress = 0.5;

  if (isPlaying) {
    playTime += dt;
    if (playTime >= tl.duration) {
      playTime = tl.duration;
      stopPlayback();
    }
    sound.triggerCues(currentMode, playTime);

    activeAct = tl.acts.find(a => playTime >= a.start && playTime <= a.end) || tl.acts[tl.acts.length - 1];
    localProgress = (playTime - activeAct.start) / (activeAct.end - activeAct.start);

    // Evaluate 100% Continuous C2-Smooth Spherical Camera Spline (Zero jump-cuts!)
    const camState = evaluateSeamlessSpline(currentMode, playTime);
    const azRad = THREE.MathUtils.degToRad(camState.az);
    const elRad = THREE.MathUtils.degToRad(camState.el);
    const horizR = camState.r * Math.cos(elRad);

    camera.position.set(
      camState.tx + horizR * Math.cos(azRad),
      camState.ty + camState.r * Math.sin(elRad),
      camState.tz + horizR * Math.sin(azRad)
    );
    controls.target.set(camState.tx, camState.ty, camState.tz);
    currentExplode = camState.exp;

    document.getElementById('timeline-fill').style.width = ((playTime / tl.duration) * 100).toFixed(1) + '%';
    document.getElementById('time-readout').textContent = `${formatTime(playTime)} / ${formatTime(tl.duration)}`;
    document.getElementById('act-readout').textContent = activeAct.badge;
    document.querySelectorAll('.scene-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.act) === activeAct.id);
    });
  } else {
    currentExplode = THREE.MathUtils.lerp(currentExplode, manualExplode ? 1.0 : 0.0, dt * 4.5);
  }

  // Apply Full 16-Group Multi-Directional Exploded View Offsets (including ESP32-S3 CAM, Tail Antenna, 12mm Metal Button, and 5-Layer Mecanum Base!)
  const exp = currentExplode;
  groups.cube_cam.position.set(0, exp * 116, 0);             // ESP32-S3 CAM lifts +48mm above cube_top!
  groups.cube_antenna.position.set(-exp * 58, exp * 76, 0);  // Tail Dipole Antenna explodes backward -58mm & up!
  groups.cube_pwr_btn.position.set(-exp * 38, exp * 68, 0);  // 12mm Metal Power Button explodes backward -38mm!
  groups.cube_top.position.set(0, exp * 68, 0);              // Top PETG Shell + ReShape Logo + 5 Black Pads + RESHAPE LAB Badges
  groups.cube_display.position.set(exp * 60, exp * 28, 0);   // Front Bezel + 2.8" ILI9341 TFT explodes forward +60mm
  groups.cube_pcb.position.set(0, exp * 26, 0);              // Custom Altium PCB (pcb_xiaozhi NEW) + WeAct ESP32-S3
  groups.cube_battery.position.set(0, exp * 10, 0);          // Cube Li-ion Battery
  groups.cube_bot.position.set(0, -exp * 6, 0);              // Bottom PETG Shell (with code-flashing holes)
  groups.dock_plate.position.set(0, -exp * 26, 0);           // Top Docking Plate (đế lót + ReShape Gear-Circuit Logo)
  groups.base_pcb.position.set(0, -exp * 44, 0);             // Mecanum Base Controller PCB (newly added!)
  groups.base_chassis.position.set(0, -exp * 64, 0);         // Mecanum Upper Chassis (đế xe mecanum)
  groups.base_motors.position.set(0, -exp * 92, 0);          // 4x Metal Johnson Geared Motors drop down below upper chassis!
  groups.base_battery.position.set(0, -exp * 92, 0);         // 4x18650 Base Battery Box drops down alongside motors!
  groups.base_bottom.position.set(0, -exp * 120, 0);         // Mecanum Bottom Cover Plates (đế xe mecanum dưới) drop to bottom!

  const pivs = window.XIAOZHI_IAM_DATA ? window.XIAOZHI_IAM_DATA.wheelPivots : {};
  ['wheel_FL', 'wheel_FR', 'wheel_RL', 'wheel_RR'].forEach(wName => {
    const p = pivs[wName];
    if (!p) return;
    const zSign = p[2] >= 0 ? 1 : -1;
    groups[wName].position.set(p[0], p[1] - exp * 64, p[2] + zSign * exp * 50);
  });
  floorMesh.position.y  = -78.0 - exp * 120;
  gridHelper.position.y = -77.8 - exp * 120;

  // Smooth Dynamic Robot Choreography (using smooth sin envelopes so robot position never jumps at Act boundaries!)
  const tSec = isPlaying ? playTime : now * 0.001;
  let wheelSpeedFL = 1.6, wheelSpeedFR = 1.6, wheelSpeedRL = 1.6, wheelSpeedRR = 1.6;

  if (currentMode === 'media' && activeAct && activeAct.id === 0) {
    const env = Math.sin(localProgress * Math.PI);
    robotRoot.rotation.y = Math.sin(tSec * 2.6) * 0.22 * env;
    robotRoot.rotation.z = Math.sin(tSec * 3.2) * 0.035 * env;
    robotRoot.position.set(0, 0, 0);
  } else if (currentMode === 'media' && activeAct && activeAct.id === 2) {
    const env = Math.sin(localProgress * Math.PI);
    robotRoot.rotation.y = Math.sin(tSec * 1.5) * 0.26 * env;
    micWaveRings.forEach(item => {
      const wv = (now * 0.0022 + item.idx * 0.33) % 1.0;
      item.mesh.position.set(0, 58 + currentExplode * 24, item.side * (95 - wv * 38));
      item.mesh.scale.setScalar(1.3 - wv * 0.6);
      item.mesh.material.opacity = (1 - wv) * 0.85 * env;
    });
  } else if ((currentMode === 'commercial' && activeAct && activeAct.id === 3) ||
             (currentMode === 'media' && activeAct && activeAct.id === 3)) {
    // Smooth bell-curve envelope (0 at start of Act 3, 1 in middle, 0 at end of Act 3 -> zero jump!)
    const env = Math.sin(localProgress * Math.PI);
    robotRoot.position.x = Math.sin(localProgress * Math.PI * 2) * 40 * env;
    robotRoot.position.z = Math.sin(localProgress * Math.PI * 4) * 26 * env;
    robotRoot.rotation.y = Math.sin(localProgress * Math.PI * 2) * 0.42 * env;
    wheelSpeedFL = 8.5; wheelSpeedFR = -8.5; wheelSpeedRL = -8.5; wheelSpeedRR = 8.5;

    // Smooth Unpair Vertical Docking Lift in the second half of Act 3 (both Commercial & Media!)
    if (localProgress > 0.54) {
      const liftPhase = (localProgress - 0.54) / 0.46;
      const lift = Math.sin(liftPhase * Math.PI) * 44;
      groups.cube_cam.position.y += lift;
      groups.cube_antenna.position.y += lift;
      groups.cube_pwr_btn.position.y += lift;
      groups.cube_top.position.y += lift;
      groups.cube_display.position.y += lift;
      groups.cube_pcb.position.y += lift;
      groups.cube_battery.position.y += lift;
      groups.cube_bot.position.y += lift;
      if (lift > 15) {
        wheelSpeedFL = 0; wheelSpeedFR = 0; wheelSpeedRL = 0; wheelSpeedRR = 0;
      }
    }

    espNowRings.forEach((r, idx) => {
      const wave = (now * 0.002 + idx * 0.33) % 1.0;
      r.position.set(robotRoot.position.x, 10 - wave * 50, robotRoot.position.z);
      r.scale.setScalar(0.6 + wave * 0.9);
      r.material.opacity = (1 - wave) * 0.8 * env;
    });
  } else {
    robotRoot.position.x = THREE.MathUtils.lerp(robotRoot.position.x, 0, dt * 5);
    robotRoot.position.z = THREE.MathUtils.lerp(robotRoot.position.z, 0, dt * 5);
    robotRoot.rotation.y = THREE.MathUtils.lerp(robotRoot.rotation.y, 0, dt * 5);
    robotRoot.rotation.z = THREE.MathUtils.lerp(robotRoot.rotation.z, 0, dt * 5);
    espNowRings.forEach(r => { r.material.opacity = 0; });
    micWaveRings.forEach(m => { m.mesh.material.opacity = 0; });
  }

  groups.wheel_FL.rotation.x += dt * wheelSpeedFL;
  groups.wheel_FR.rotation.x += dt * wheelSpeedFR;
  groups.wheel_RL.rotation.x += dt * wheelSpeedRL;
  groups.wheel_RR.rotation.x += dt * wheelSpeedRR;

  updateLivingEyes(tSec, currentMode, activeAct ? activeAct.id : 0);
  controls.update();
  renderer.render(scene, camera);
  renderCompositeFrame(activeAct, localProgress, tSec);
}

function formatTime(s) {
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = (s % 60).toFixed(1).padStart(4, '0');
  return `${mm}:${ss}`;
}

// ============================================================================
// 9. UI EVENT HANDLERS, MODE SWITCHER & 60FPS VIDEO RECORDER
// ============================================================================
const btnPlay = document.getElementById('btn-play');
const btnRecord = document.getElementById('btn-record');
const btnExplode = document.getElementById('btn-explode');
const btnSimReal = document.getElementById('btn-simreal');
const btnRealCam = document.getElementById('btn-realcam');
const btnAudio = document.getElementById('btn-audio');
const tabCommercial = document.getElementById('tab-commercial');
const tabMedia = document.getElementById('tab-media');

function switchMode(newMode) {
  currentMode = newMode;
  isPlaying = false;
  playTime = 0;
  sound.lastCue = -1;
  tabCommercial.className = 'mode-tab' + (newMode === 'commercial' ? ' active-commercial' : '');
  tabMedia.className = 'mode-tab' + (newMode === 'media' ? ' active-media' : '');
  rebuildSceneButtons();
  document.getElementById('time-readout').textContent = `00:00.0 / ${formatTime(TIMELINES[newMode].duration)}`;
  document.getElementById('act-readout').textContent = newMode === 'commercial'
    ? 'MODE 1: 45s RESHAPE COMMERCIAL'
    : 'MODE 2: 30s SIM-TO-REAL & REACHY MEDIA';
  btnPlay.textContent = '▶ PHÁT VIDEO (CÓ ÂM THANH)';
}

tabCommercial.addEventListener('click', () => switchMode('commercial'));
tabMedia.addEventListener('click', () => switchMode('media'));

function startPlayback(fromStart = true) {
  sound.resume();
  const dur = TIMELINES[currentMode].duration;
  if (fromStart || playTime >= dur - 0.3) {
    playTime = 0;
    sound.lastCue = -1;
  }
  isPlaying = true;
  document.body.classList.add('cinema-active');
  btnPlay.textContent = '⏸ TẠM DỪNG';
}

function stopPlayback() {
  isPlaying = false;
  btnPlay.textContent = '▶ PHÁT VIDEO (CÓ ÂM THANH)';
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

btnPlay.addEventListener('click', () => {
  if (isPlaying) stopPlayback();
  else startPlayback(playTime >= TIMELINES[currentMode].duration - 0.4 || playTime === 0);
});

document.getElementById('timeline-bar').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  playTime = ratio * TIMELINES[currentMode].duration;
  sound.lastCue = -1;
  if (!isPlaying) startPlayback(false);
});

btnExplode.addEventListener('click', () => {
  isPlaying = false;
  manualExplode = !manualExplode;
  btnExplode.classList.toggle('active', manualExplode);
  btnPlay.textContent = '▶ PHÁT VIDEO (CÓ ÂM THANH)';
});

btnSimReal.addEventListener('click', () => {
  manualSimReal = !manualSimReal;
  btnSimReal.classList.toggle('active', manualSimReal);
});

// Attach Real Robot Video (.mp4) or Live Webcam for Sim-to-Real Split Screen!
const videoInput = document.getElementById('video-file-input');
btnRealCam.addEventListener('click', async () => {
  if (realVideoActive) {
    realVideoActive = false;
    btnRealCam.classList.remove('active');
    btnRealCam.textContent = '📷 Ghép Video/Cam Thật';
    if (realVideoEl.srcObject) {
      realVideoEl.srcObject.getTracks().forEach(t => t.stop());
      realVideoEl.srcObject = null;
    }
    return;
  }
  // Try opening file picker for a real robot video clip (.mp4/.mov), or webcam if canceled
  videoInput.click();
});

videoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  realVideoEl.srcObject = null;
  realVideoEl.src = URL.createObjectURL(file);
  realVideoEl.play();
  realVideoActive = true;
  manualSimReal = true;
  btnSimReal.classList.add('active');
  btnRealCam.classList.add('active');
  btnRealCam.textContent = '📷 Đang ghép Video Thật (Click để tắt)';
});

btnAudio.addEventListener('click', () => {
  sound.enabled = !sound.enabled;
  btnAudio.textContent = sound.enabled ? '🔊 Nhạc: BẬT' : '🔇 Nhạc: TẮT';
});

// 60FPS Video Recorder
let mediaRecorder = null;
let recordedChunks = [];

btnRecord.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  sound.resume();
  recordedChunks = [];
  const stream = outCanvas.captureStream(60);
  if (sound.dest && sound.enabled) {
    const aTracks = sound.dest.stream.getAudioTracks();
    if (aTracks.length > 0) stream.addTrack(aTracks[0]);
  }
  const mimeTypes = [
    'video/mp4;codecs=avc1',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  let selectedMime = '';
  for (const m of mimeTypes) {
    if (MediaRecorder.isTypeSupported(m)) { selectedMime = m; break; }
  }
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: selectedMime || undefined,
    videoBitsPerSecond: 16000000
  });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = () => {
    btnRecord.classList.remove('recording');
    btnRecord.textContent = '🔴 GHI & TẢI VIDEO (.WEBM / MP4 60FPS)';
    document.getElementById('rec-badge').classList.remove('show');
    const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const tag = currentMode === 'commercial' ? '45s_Apple_NVIDIA_Commercial' : '30s_SimToReal_Reachy_Media';
    a.download = `Xiaozhi_Pro_${tag}_60FPS.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  mediaRecorder.start(100);
  btnRecord.classList.add('recording');
  btnRecord.textContent = '⏹ DỪNG & LƯU VIDEO';
  document.getElementById('rec-badge').classList.add('show');
  startPlayback(true);
});

requestAnimationFrame(animate);
</script>
